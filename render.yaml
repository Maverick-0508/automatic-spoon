services:
  - type: web
    name: lawncraft-api
    env: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lawncraft-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: lawncraft-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_MINUTES
        value: "15"
      - key: JWT_REFRESH_DAYS
        value: "7"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://dashboard.yourdomain.com,https://www.yourdomain.com"
      - key: LOG_LEVEL
        value: "INFO"

  - type: worker
    name: lawncraft-worker
    env: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A app.workers.celery_app worker --beat --loglevel=info"
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lawncraft-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: lawncraft-redis
          type: redis
          property: connectionString

databases:
  - name: lawncraft-db
    databaseName: lawncraft
    user: lawncraft
    plan: starter

  - name: lawncraft-redis
    type: redis
    plan: starter
    ipAllowList: []
