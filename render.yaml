services:
  - type: web
    name: lawncraft-api
    env: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "alembic -c migrations/alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: lawncraft-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_MINUTES
        value: "15"
      - key: JWT_REFRESH_DAYS
        value: "7"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://lawncraft.vercel.app,https://cautious-potato-tau.vercel.app"
      - key: LOG_LEVEL
        value: "INFO"

  - type: worker
    name: lawncraft-worker
    env: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "celery -A app.workers.celery_app worker --beat --loglevel=info"
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: lawncraft-redis
          type: redis
          property: connectionString

  - type: redis
    name: lawncraft-redis
    plan: starter
    region: oregon
    ipAllowList: []

